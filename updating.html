<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chally Studio｜網站更新中</title>
<meta name="theme-color" content="#0d0f10">
<link rel="icon" href="assets/badge.png">
<style>
:root{
  --bg:#0d0f10; --line:#2a2f34; --ink:#f2f4f1; --dim:#c8d2cb;
  --gold:#c69a4e; --gold-lt:#e8c68f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Microsoft JhengHei UI","PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:34px;padding:48px 24px;text-align:center;color:var(--ink);font-family:var(--sans);
  line-height:1.9;letter-spacing:.2px;-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:
    radial-gradient(120% 60% at 50% -10%,rgba(198,154,78,.07) 0%,rgba(13,15,16,0) 62%),
    linear-gradient(180deg,#0e1011 0%,#0d0f10 40%,#0b0d0e 100%);
  background-repeat:no-repeat}
img{display:block}
.badge{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
h1{margin:0;font-family:var(--serif);font-weight:700;letter-spacing:.14em;
  font-size:clamp(26px,5.4vw,46px);line-height:1.5}
h1 .l2{display:block;margin-top:14px;font-size:clamp(17px,2.6vw,24px);
  letter-spacing:.42em;padding-left:.42em;color:var(--gold-lt)}
.rule{width:64px;height:1px;background:var(--gold);opacity:.55}
.note{margin:0;font-size:14.5px;letter-spacing:.18em;color:var(--gold-lt);font-family:var(--serif)}
.mail{margin:0;font-size:12.5px;letter-spacing:.12em;color:var(--dim);opacity:.75}
.mail a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(198,154,78,.3)}
.mail a:hover{color:var(--gold-lt)}
</style>
</head>
<body>
  <img class="badge" src="assets/badge.png" alt="Chally Studio">
  <h1>網站更新中<span class="l2">請稍後再來</span></h1>
  <div class="rule"></div>
  <p class="note">感謝指教 · 歡迎再來</p>
  <p class="mail"><a href="mailto:contact@challystudio.com">CONTACT @CHALLYSTUDIO.COM</a></p>
</body>
</html>
